<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResumeSetu — Precision Resume Matcher &amp; ATS Tailoring</title>
    <meta
      name="description"
      content="Match your resume against any job description, uncover missing keywords, and get tailored single-column resumes."
    />
    <meta property="og:title" content="ResumeSetu — Precision Resume Matcher &amp; ATS Tailoring" />
    <meta
      property="og:description"
      content="Match your resume against any job description, uncover missing keywords, and get tailored single-column resumes."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#F4F0E6" />
    <!-- Favicon: Greek temple mark used by the top navigation. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http://www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%2317364A%22/%3E%3Cpath%20d%3D%22M4%2011.5%2016%205l12%206.5v2H4z%22%20fill%3D%22%23D7C197%22/%3E%3Cpath%20d%3D%22M6%2015h20M5%2026h22M8%2016v8m5-8v8m6-8v8m5-8v8%22%20stroke%3D%22%23F4F0E6%22%20stroke-width%3D%222%22/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <!--
      Only the families actually referenced by the design system.
      Lenis ships through the npm dependency and its required .lenis rules are
      already duplicated in src/index.css, so the previous CDN <script>/<link>
      pair (which loaded a second, older copy) has been removed.

      The stylesheet is loaded non-render-blocking (preload + print-media swap):
      a render-blocking fetch of 4 font families used to delay first paint
      until fonts.googleapis.com responded.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;700;800&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <noscript>
      ResumeSetu needs JavaScript enabled to analyse your resume.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
